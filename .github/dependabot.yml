# Monthly dependency and GitHub Actions updates, grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # requirements.txt holds minimum versions on purpose: the project supports Python 3.10+,
    # and raising the pandas/numpy floors would silently drop 3.10/3.11.
    ignore:
      - dependency-name: "pandas"
      - dependency-name: "numpy"
    open-pull-requests-limit: 3
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-updates:
        patterns: ["*"]
