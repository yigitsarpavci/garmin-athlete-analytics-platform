name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Kişisel data/ klasörü repoda yoktur; testler sentetik sample_data/ ile çalışır.
      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: pip install ruff && ruff check app tests scripts

      - name: Run test suite
        env:
          GARMIN_DEMO_MODE: "1"
        run: python -B tests/run_tests.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Statik Tailwind CSS güncel mi?
        run: |
          ./tools/build_css.sh
          git diff --exit-code app/static/css/tailwind.css || (echo "css/tailwind.css eski: 'make css' çalıştırıp commit'leyin" && exit 1)

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          for f in app/static/js/*.js scripts/*.mjs; do
            node --check "$f"
          done
